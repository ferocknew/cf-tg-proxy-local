name: build-and-push-image

on:
  push:
    tags: ['[0-9]*']   # 仅无 v 前缀的数字 tag（如 0.1.0）触发构建；push main 不触发
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # 镜像名必须小写（GHCR 要求）
      - name: 小写镜像名
        id: repo
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      # buildx（当前仅 linux/amd64，暂不考虑 arm）
      - uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 镜像 tag 取自 VERSION 文件（与 git tag 对齐，无 v 前缀，如 0.1.0）
      - name: 读取版本号
        id: ver
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: 生成 tags / labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}
          flavor: latest=true
          tags: |
            type=raw,value=${{ steps.ver.outputs.version }}
            type=ref,event=branch

      - name: 构建并推送（linux/amd64）
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
